name: Deploy to AWS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Strata Image
        run: |
          docker build -t strata:latest -f docker/strata.Dockerfile .
          docker tag strata:latest ${{ steps.login-ecr.outputs.registry }}/strata:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/strata:latest

      - name: OpenTofu Apply
        run: |
          cd tofu/prod
          tofu init
          tofu apply -auto-approve
