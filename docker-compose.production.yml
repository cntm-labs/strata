version: '3.8'

services:
  caddy:
    image: caddy:2.7-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend-net
      - backend-net
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M

  strata:
    build: 
      context: .
      dockerfile: docker/strata.Dockerfile
    restart: unless-stopped
    env_file: .env.production
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  backup:
    build:
      context: .
      dockerfile: docker/backup.Dockerfile
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      - postgres
    networks:
      - backend-net

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./dev/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - backend-net
    expose:
      - "9090"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    networks:
      - backend-net
    expose:
      - "3100"

networks:
  frontend-net:
  backend-net:
    internal: true

volumes:
  pgdata:
  caddy_data:
  caddy_config:
