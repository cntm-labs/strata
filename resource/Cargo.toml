[package]
name = "strata-resource"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "strata-server"
path = "core/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "derive", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
thiserror = "2"
cntm-nucleus = "0.3"
chorus-rs = { version = "0.2.0", git = "https://github.com/cntm-labs/chorus.git", tag = "chorus-rs-v0.2.0" }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
sentry = { version = "0.36", default-features = false, features = ["reqwest", "rustls", "panic", "tower-http", "tracing", "test"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
wiremock = "0.6"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "migrate"] }

[lints]
workspace = true
